
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAPTER 1 - Silent Sunrise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .reader {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 3.2vh 4.4vw 1.5vh;
    }

    .chapter-title {
      text-align: center;
      font-size: clamp(16px, 2vw, 26px);
      margin-bottom: 2vh;
      flex-shrink: 0;
    }

    .pages {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.6vw;
    }

    .page {
      position: relative;
      min-width: 0;
      border: 2px solid white;
      padding: 2.2vh 2.2vw 5vh;
      overflow: hidden;
    }

    .content {
      font-size: clamp(14px, 1.75vw, 24px);
      line-height: 1.35;
      white-space: pre-line;
      overflow-wrap: break-word;
    }

    .number {
      position: absolute;
      bottom: 1.1vh;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 20px;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 7vh;
      flex-shrink: 0;
    }

    .arrow {
      border: none;
      background: none;
      color: white;
      font-family: Arial, sans-serif;
      font-size: clamp(40px, 5vw, 64px);
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .arrow:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .music-control {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 10;
      font-family: Georgia, "Times New Roman", serif;
    }

    #musicButton {
      background: black;
      color: white;
      border: 1px solid white;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    .music-panel {
      width: 180px;
      margin-top: 6px;
      padding: 14px;
      background: black;
      color: white;
      border: 1px solid white;
    }

    .music-panel[hidden] {
      display: none;
    }

    .music-panel label {
      display: block;
      margin-bottom: 10px;
    }

    #volumeSlider {
      width: 100%;
      accent-color: white;
      cursor: pointer;
    }

    #volumeValue {
      display: block;
      margin-top: 6px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .reader {
        padding: 2vh 3vw 1vh;
      }

      .pages {
        gap: 3vw;
      }

      .page {
        padding: 1.5vh 2vw 4vh;
      }

      .content {
        font-size: clamp(12px, 3vw, 18px);
      }

      .number {
        font-size: 15px;
      }

      .music-control {
        top: 6px;
        left: 6px;
      }

      #musicButton {
        padding: 6px 9px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="music-control">
    <button
      id="musicButton"
      type="button"
      aria-expanded="false"
      aria-controls="musicPanel"
    >Music</button>

    <div class="music-panel" id="musicPanel" hidden>
      <label for="volumeSlider">Volume</label>
      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        value="50"
      >
      <span id="volumeValue">50%</span>
    </div>
  </div>

  <audio id="backgroundMusic" src="happymusic.mp3" loop preload="auto"></audio>

  <main class="reader">
    <header class="chapter-title">
      CHAPTER 1 - Silent Sunrise
    </header>

    <div class="pages">
      <section class="page">
        <div class="content" id="leftText"></div>
        <div class="number" id="leftNumber">1</div>
      </section>

      <section class="page">
        <div class="content" id="rightText"></div>
        <div class="number" id="rightNumber">2</div>
      </section>
    </div>

    <nav class="navigation">
      <button class="arrow" id="previous"
        aria-label="Previous pages" disabled>⟵</button>

      <button class="arrow" id="next"
        aria-label="Next pages">⟶</button>
    </nav>
  </main>

  <script>
    const pages = [
      `As the sun rose for another day in Teletubbyland, the same morning routine began as usual. The rabbits left their homes, the many flowers bloomed all across the fields and the Teletubbies opened their eyes.
"Good morning, Teletubbyland!" Tinky Winky exclaimed, sitting up in his bed.
"Good morning Tinky Winky! Good morning Dipsy!" Laa Laa replied, also sitting up.
Dipsy sat up in bed and looked around for a little bit before asking:
"How did everybody sleep?"
"Awesome!" Said Tinky Winky, standing up from his bed.
"Like a baby!" Said Laa Laa right before a long yawn.
"What about you Po?" Tinky Winky asked, looking at Po's bed.
"Hmmm... That's weird, Po isn't in her bed." Laa Laa replied.
"Maybe she woke up earlier than us? I'm sure it's okay! She's done this many times before." Said Tinky Winky as he began walking towards the front door and opening it, allowing sunlight to flood the house.
Tinky Winky walked outside while his friends were still getting out of bed, and noticed something peculiar.
"That's weird..."
"What's wrong Tinky Winky?" Laa Laa asked.
"It's just that... The speakers still haven't risen from the ground to tell us what to do."`,

      `"Oh? That's weird, I don't think that has ever happened before. I'm sure they'll be here anytime soon though!"
Meanwhile, Po was standing at the shore of the beach, staring into the horizon. She sat down in the sand, processing many complex thoughts, before interrupted by the sound of someone approaching behind.
"Hello Po." Noo Noo said while gliding next to Po.
"Oh hello Noo Noo! It's nice seeing you here."
"I am glad to hear that, but may I ask, why are you here isolated from the others?"
"Well Noo Noo... I couldn't sleep at night because my head was full of questions and thoughts, I'm not sure why."
"What kind of thoughts if you do not mind me asking?"
"Various thoughts, but mainly about what could be beyond Teletubbyland, I mean, we have never left this place our entire lifes, and we've been following orders from those speakers ever since we were born, I'm not complaining but... I just want to know why."
"There are many questions I cannot answer, I have little knowledge about everything, just like you, but I do know that things will be better soon."
"How so?"
"The speakers told me a secret, and they told me not to share with you, but since I trust you, I will tell you it."`,

      `Po looked at Noo Noo's eyes curiously, with sparks of hope in her eyes.
"The speakers told me that today will be very special. Soon, all of you will be able to explore the horizon, and even unlock your true potential hidden inside yourselves."
"That sounds awesome!" Po said with a big grin in her face, standing up and wiping sand off her body.
"Can i tell this secret to my friends Mr. Noo Noo?" Po asked.
"Of course you can, I'm sure they'll love to hear it."
"Yay! Thank you Mr. Noo Noo!"
"You're welcome Po. You should head home now, your friends must be waiting for you and you still haven't eaten your custard today."
"Right! I'm pretty hungry. See you later Noo Noo!"
"Goodbye Po."
Po began running out of the beach towards the house, until, Noo Noo shouted:
"Po! Wait!"
Po turned around and asked:
"Huh? What's up Noo Noo?"
"I just wanted to tell you, I love you, and I'll always love you no matter what happens."
"Awww... That's so sweet of you! I love you too Noo Noo!" Po replied, before waving at Noo Noo and going back towards the house.`,

      `As Po arrived at the house, her friends were all grouped around the custard machine, until Tinky Winky noticed her and ran up to her to give her a big hug.
"Po! I'm so glad you're back! Today has been such a weird day..." Tinky Winky said.
"Really? What's wrong?" Po replied.
"Well for starters, none of the speakers actually came from the ground today to give us orders, and now, the custard machine is broken!"
"Oh that sucks... Maybe this has to do with what Noo Noo told me?"
Everyone else looked at Po confused, and Dipsy asked:
"Noo Noo told you something? What is it?"
"Well, Noo Noo said today will be a really special day!"
Tinky Winky suddenly became really excited, and said:
"REALLY? We haven't had a special day ever since that creepy lion and bear showed up! Oh man I can't wait to see what's up for today's special day!"
Dipsy didn't seem very happy, and Laa Laa noticed.
"What's wrong dipsy? Aren't you excited about the special day?" Laa Laa asked.
"I definetly am but, I'm pretty bothered by the fact we still haven't eaten anything today, plus I still haven't found my hat I lost, and it's bumming me out!"
Po looked at Dipsy and put her hand on his shoulders, and Dipsy looked at her confused.`,

      `"Don't worry Dipsy! I'll try to fix the custard machine so we can all have a great time today and prepare for the special day."
Dipsy's eyes lightened up as he brought Po closer for a big hug.
"Thanks Po! You're a savior."
Po smiled and walked away, heading towards the other side of the house where a table with a toolbox on top laid.
"Let's see..."
Po opened the toolbox, and began pulling out various objects.
"Hmmm... Hammer? ..Too dangerous... A flashlight? I don't think this could be useful... A rope? In what scenario would we ever need this?"
Po began growing more frustrated, as most of the things she found were just junk she couldn't use, until something caught her eye.
"Aha! A wrench! I can probably use this to fix the machine."
Po ran back to the machine as the other tubbies watched her.
"Watch and learn!"
She began slowly fixing the machine, while the other tubbies watched.
Tinky Winky began feeling bored and decided to walk outside while Po fixed the custard machine, and Laa Laa decided to follow behind.
"Hey Laa Laa." Tinky Winky said, looking somewhat worried.
"Is there something bothering you Tinky Winky?" Laa Laa said, looking at his eyes."`,

      `"It's just that... I'm worried about the fact the speakers haven't showed up, the windmill hasn't given us any videos to play, and now the machine is broken! Today's special day just feels like the first bad day in Teletubbyland..."
Laa Laa sat down in the grass with him and looked at the sky.
"I... Get it. Changes can be very scary sometimes Tinky Winky, but our lives would just feel like a boring loop if things didn't change every now and then. Bad days are normal things, they pull us out of our comfort zones to show us how much prettier life can be if we're open to let it change when it has to."
Tinky Winky looked at Laa Laa, impressed by her words.
"Woah Laa Laa... I've never looked at it this way... I guess you're right..."
"Have I ever been wrong?" Laa Laa giggled and Tinky Winky smiled.
"I guess I should be seeing this special day as an opportunity rather than an obstacle. Thanks for telling me this Laa Laa, I think I needed to hear it."
"You're welcome Tinky Winky! Now... Can we go back inside please? The sun's hurting my eyes."
"You have pretty sensitive eyes huh?"
Laa Laa smiled and gave him a gentle joke punch on the shoulder, before standing up and going back to the house as he followed behind."
`,

      `Write the contents of page 7 here.`,
      `Write the contents of page 8 here.`,
      `Write the contents of page 9 here.`,
      `Write the contents of page 10 here.`
    ];

    let currentPage = 0;

    const leftText = document.getElementById("leftText");
    const rightText = document.getElementById("rightText");
    const leftNumber = document.getElementById("leftNumber");
    const rightNumber = document.getElementById("rightNumber");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");

    function renderPages() {
      leftText.textContent = pages[currentPage] || "";
      rightText.textContent = pages[currentPage + 1] || "";

      leftNumber.textContent = currentPage + 1;
      rightNumber.textContent = currentPage + 2;

      previous.disabled = currentPage === 0;
      next.disabled = currentPage + 2 >= pages.length;
    }

    previous.addEventListener("click", () => {
      if (currentPage >= 2) {
        currentPage -= 2;
        renderPages();
      }
    });

    next.addEventListener("click", () => {
      if (currentPage + 2 < pages.length) {
        currentPage += 2;
        renderPages();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") previous.click();
      if (event.key === "ArrowRight") next.click();
    });

    const musicButton = document.getElementById("musicButton");
    const musicPanel = document.getElementById("musicPanel");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeValue = document.getElementById("volumeValue");
    const backgroundMusic = document.getElementById("backgroundMusic");

    volumeSlider.value = 50;
    backgroundMusic.volume = 0.5;

    musicButton.addEventListener("click", () => {
      const isOpening = musicPanel.hidden;

      musicPanel.hidden = !isOpening;
      musicButton.setAttribute("aria-expanded", String(isOpening));

      if (isOpening && backgroundMusic.paused) {
        backgroundMusic.play().catch(() => {
          volumeValue.textContent = "Playback unavailable";
        });
      }
    });

    volumeSlider.addEventListener("input", () => {
      const volume = Number(volumeSlider.value);
      backgroundMusic.volume = volume / 100;
      volumeValue.textContent = `${volume}%`;
    });

    renderPages();
  </script>
</body>
</html>
